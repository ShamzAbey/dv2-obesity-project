<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <defs>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Left column boxes -->
  <g fill="#9fd9e9" filter="url(#s)">
    <rect x="10" y="20" rx="8" ry="8" width="220" height="120" />
    <rect x="10" y="200" rx="8" ry="8" width="220" height="120" />
  </g>

  <!-- Middle column boxes -->
  <g fill="#2f93c6" filter="url(#s)">
    <rect x="470" y="20" rx="8" ry="8" width="220" height="120" />
    <rect x="470" y="200" rx="8" ry="8" width="220" height="120" />
  </g>

  <!-- Right column boxes -->
  <g fill="#0b4f6c" filter="url(#s)">
    <rect x="930" y="20" rx="8" ry="8" width="220" height="120" />
    <rect x="930" y="200" rx="8" ry="8" width="220" height="120" />
  </g>

  <!-- Far right column boxes -->
  <g fill="#4fc1c8" filter="url(#s)">
    <rect x="1220" y="80" rx="8" ry="8" width="160" height="200" />
  </g>

  <!-- Connecting ribbons (simple lines) -->
  <g stroke="#7fb6cf" stroke-width="18" stroke-linecap="round" stroke-opacity="0.55">
    <path d="M230 80 C350 80, 430 80, 470 80" />
    <path d="M230 240 C350 240, 430 240, 470 240" />
    <path d="M690 80 C810 80, 890 80, 930 80" />
    <path d="M690 240 C810 240, 890 240, 930 240" />
    <path d="M1150 110 C1200 110, 1220 120, 1220 180" />
    <path d="M1150 250 C1200 250, 1220 220, 1220 220" />
  </g>

  <!-- faint axis line -->
  <line x1="0" y1="350" x2="1400" y2="350" stroke="#e6eef4" stroke-width="1"/>
</svg>
